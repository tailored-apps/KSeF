on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
name: Create Release
jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Dotnet install tools 
      run: dotnet tool install --global dotnet-xscgen
      
    - name: Dotnet generate class from xsd 
      working-directory: generated/
      run: xscgen -n "|http://crd.gov.pl/wzor/2025/06/25/13775/schemat.xsd=KSeF.Faktura" http://crd.gov.pl/wzor/2025/06/25/13775/schemat.xsd
      
    - name: Dotnet pack
      run: dotnet pack -c Release -p:Version=${GITHUB_REF##*/v} 

    - name: Dotnet Nuget Push   
      working-directory: bin/Release/
      run: dotnet nuget push KSeF.*.nupkg -s https://api.nuget.org/v3/index.json -k ${{ secrets.NUGET_API_KEY_KSEF }}
      continue-on-error: false
